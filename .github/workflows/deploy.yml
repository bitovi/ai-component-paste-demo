name: Test, build, and deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel a half-finished release; queue instead.
  cancel-in-progress: false

jobs:
  # No unit tests today: the gate is that both packages install and build.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            server/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: npm --prefix server ci
      - run: npm --prefix server run build

  release:
    needs: [test]
    uses: bitovi/platform-ci/.github/workflows/container-build.yml@0.0.1
    # A called workflow can only narrow permissions, so the caller grants them:
    # OIDC to AWS, the write-back commit, and cancelling the run when there is
    # nothing to deploy.
    permissions:
      id-token: write
      contents: write
      actions: write
    with:
      values-file: deploy/values.yaml
      # The API is the `api` workload; the `main` workload is the static UI.
      image-tag-path: .workloads.api.image.tag
      # Tag the image with the release tag rather than the commit SHA.
      image-tag: ${{ github.ref_name }}
      deploy-branch: "main"
      writeback-app-id: ${{ vars.CI_WRITEBACK_APP_ID }}
      environment-label: release
      # The API lives in server/, not the repo root.
      dockerfile: server/Dockerfile
      build-context: server
    secrets: inherit

  notify:
    name: Slack Notification
    needs: [test, release]
    if: always()
    uses: ./.github/workflows/slack-notification.yml
    with:
      status: ${{ (needs.test.result == 'success' && needs.release.result == 'success') && 'success' || 'failure' }}
      service_name: "ai-component-paste-demo"
      environment: production
      title: ${{ (needs.test.result == 'success' && needs.release.result == 'success') && 'release deployed' || 'release failed' }}
      detail: "Tag: ${{ github.ref_name }}"
    # inherit carries BITOVI_PLATFORM_SLACK_WEBHOOK_URL through to the reusable
    # workflow, which references it directly.
    secrets: inherit
