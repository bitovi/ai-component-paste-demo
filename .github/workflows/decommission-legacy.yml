name: Decommission legacy sandbox stack

# One-off, manually-triggered teardown of the pre-migration infra (EC2/ELB API
# + S3/CloudFront UI on bitovi-sandbox.com)
on:
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      # Doesn't touch AWS — just proves whether org/repo-inherited secrets
      # with these names resolve to a non-empty value in this workflow.
      - name: Check sandbox credentials are available
        id: check
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}" ]; then
            echo "Sandbox credentials are NOT set — destroy jobs will be skipped"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "Sandbox credentials are set"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

  destroy-ui:
    needs: check-secrets
    if: needs.check-secrets.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Build (unused by destroy, but action expects the folder to exist)
        run: |
          cd ui
          echo "VITE_API_URL=https://ai-component-paste-api.bitovi-sandbox.com" > .env
          npm ci
          npm run build

      - name: Destroy static site stack
        uses: bitovi/github-actions-deploy-static-site-to-aws@8bb9232d1d243d605db0c54522dfdc12b9c37520 # v0.2.5
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1
          aws_resource_identifier: bitovi-ai-component-paste-demo-main
          checkout: false
          aws_site_source_folder: /ui/dist

          tf_action: "destroy"
          tf_state_bucket: bitovi-ai-component-paste-demo-main-tf-state
          tf_state_bucket_destroy: false
          aws_site_cdn_enabled: true

          aws_r53_domain_name: bitovi-sandbox.com
          aws_r53_sub_domain_name: ai-component-paste
          aws_r53_create_sub_cert: true

  destroy-server:
    needs: check-secrets
    if: needs.check-secrets.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Destroy EC2 stack
        uses: bitovi/github-actions-deploy-docker-to-ec2@1184920b9d3548e1f3c5287de0af9deef0774c18 # v1
        with:
          docker_repo_app_directory: server/
          checkout: false
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_SANDBOX }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SANDBOX }}
          aws_default_region: us-east-1
          aws_resource_identifier: bitovi-ai-component-paste-demo-main

          tf_stack_destroy: true
          tf_state_bucket: bitovi-ai-component-paste-demo-main-tf-state
          tf_state_bucket_destroy: false

          aws_r53_enable: true
          aws_r53_create_sub_cert: true
          aws_r53_sub_domain_name: ai-component-paste-api
          aws_r53_domain_name: bitovi-sandbox.com
          aws_elb_app_port: 3000

          docker_full_cleanup: true

          aws_ec2_instance_type: t3.small
          aws_ec2_instance_root_vol_size: 16

          repo_env: repo_env
          env_ghs: ${{ secrets.DOT_ENV_DEPLOYED }}
